# Two lanes. `policy` is install-free (Node built-ins only) and checks the
# COMMITTED artifacts the way a host loads them. `build` proves the committed
# dist/ and manifest are exactly what src/ builds to — a day whose commit
# forgot to rebuild turns red here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency + pack policy
        run: node tools/check-deps.mjs
      - name: Loader contract (committed dist + manifest)
        run: node tools/contract-check.mjs
      - name: Freeze (shipped templates never change)
        run: node tools/check-freeze.mjs
      - name: Pipeline unit tests
        # A glob, not the bare directory: Node 22 rejects `pipeline/lib/` as a
        # test target on some platforms and the whole folder is skipped silently.
        run: node --test tools/check-freeze.test.mjs "pipeline/lib/*.test.mjs"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist freshness (the committed build must match the source)
        run: git diff --exit-code -- dist template-manifest.json
      - run: npm run lint
      - run: npx jest
      - run: node tools/contract-check.mjs --deep
